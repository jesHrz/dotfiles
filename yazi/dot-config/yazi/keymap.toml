#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]

prepend_keymap = [
  # Privileged file operations
  { on = [ "R", "p", "p" ], run = "plugin sudo --args='paste'",    desc = "Sudo paste" },
  { on = [ "R", "P" ],      run = "plugin sudo --args='paste -f'", desc = "Sudo paste (force)" },
  { on = [ "R", "r" ],      run = "plugin sudo --args='rename'",   desc = "Sudo rename" },
  { on = [ "R", "p", "l" ], run = "plugin sudo --args='link'",    desc = "Sudo link (absolute)" },
  { on = [ "R", "p", "L" ], run = "plugin sudo --args='link -r'", desc = "Sudo link (relative)" },
  { on = [ "R", "a" ],      run = "plugin sudo --args='create'",   desc = "Sudo create" },

  # File operations
  { on = [ "c", "a" ], run = "plugin compress", desc = "Archive selected files" },

  # Navigation
  { on = "l",       run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = "<Right>", run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = "z", run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
  { on = "Z", run = "plugin fzf",    desc = "Jump to a file or directory via fzf" },
  { on = [ "g", "o" ], run = "shell 'open .' --orphan", desc = "Open current directory in Finder", for = "macos" },

  # Interface
  { on = "T", run = "plugin toggle-pane max-preview", desc = "Maximize or restore preview" },
  { on = "!", run = "shell '$SHELL' --block", desc = "Open shell here", for = "unix" },
]
